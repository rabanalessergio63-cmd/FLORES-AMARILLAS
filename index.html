<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tarjeta inicial con el texto solicitado -->
    <div class="card" id="card">
        <h1>Haz click aquí 💛</h1>
    </div>

    <!-- Contenedor de la sorpresa (el perrito con el ramo) que aparecerá al hacer clic -->
    <div class="surprise-container" id="surpriseContainer">
        <img src="perrito.png" alt="Perrito con flores amarillas" class="surprise-img">
    </div>

    <!-- Contenedor donde flotan las flores amarillas -->
    <div class="flowers-container" id="flowersContainer"></div>

    <script src="script.js"></script>
</body>
</html>
