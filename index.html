<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Para Ti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tarjeta inicial con el botón de click -->
    <div class="card" id="card">
        <h1>Haz click aquí 💛</h1>
    </div>

    <!-- Contenedor de la sorpresa con el botón X para regresar -->
    <div class="surprise-container" id="surpriseContainer">
        <button class="close-btn" id="closeBtn">×</button>
        <h2 class="title-glow">Flores Para Ti 🌻</h2>
        <img src="ramo.png" alt="Flores Amarillas" class="bouquet-img" id="surpriseImg">
    </div>

    <!-- Contenedor de flores flotantes de fondo -->
    <div class="flowers-container" id="flowersContainer"></div>

    <script src="script.js"></script>
</body>
</html>
