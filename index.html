<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Para Ti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tarjeta inicial con el botón de click -->
    <div class="card" id="card">
        <h1>Haz click aquí 💛</h1>
    </div>

    <!-- Contenedor del ramo que aparece al hacer clic -->
    <div class="surprise-container" id="surpriseContainer">
        <h2 class="title-glow">Flores Para Ti 🌻</h2>
        <!-- Asegúrate de tener una imagen de un ramo de girasoles llamada ramo.png o cambia el nombre aquí -->
        <img src="ramo.png" alt="Ramo de Flores Amarillas" class="bouquet-img">
    </div>

    <!-- Contenedor de flores/estrellas flotantes de fondo -->
    <div class="flowers-container" id="flowersContainer"></div>

    <script src="script.js"></script>
</body>
</html>
